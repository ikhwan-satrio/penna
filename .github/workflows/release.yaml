name: Build, Release, Changelog & Update Flake Hash

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (contoh: 1.0.0 atau v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-and-update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            TAG="${RAW#v}"
            TAG="v${TAG}"
            VER="${TAG#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Build release artifact
        id: build
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          ASSET_NAME="penna-${VER}-linux-x86_64.tar.gz"
          # Ganti bagian ini dengan perintah build binary penna yang sebenarnya
          # Contoh:
          # tar -czf "dist/${ASSET_NAME}" -C target/release penna
          echo "dummy-binary-penna-${VER}" > "dist/${ASSET_NAME}"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from git commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag }}^" 2>/dev/null || true)

          {
            echo "## Changelog (${{ steps.ver.outputs.tag }})"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..${{ steps.ver.outputs.tag }}"
            else
              git log --no-merges --pretty=format:"- %s (%h)" "${{ steps.ver.outputs.tag }}"
            fi
            echo ""
          } > CHANGELOG_ENTRY.md

          if [ -f CHANGELOG.md ]; then
            {
              cat CHANGELOG_ENTRY.md
              echo ""
              cat CHANGELOG.md
            } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          else
            cp CHANGELOG_ENTRY.md CHANGELOG.md
          fi

      - name: Create GitHub Release & upload artifact
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: CHANGELOG_ENTRY.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Fetch release asset hash & update version and hash in flake.nix
        id: hash
        env:
          ASSET_NAME: penna-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          REPO: ikhwan-satrio/penna
        run: |
          ASSET_URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET_NAME}"
          echo "Fetching URL: $ASSET_URL"

          RAW_HASH=""
          for i in 1 2 3 4 5; do
            if RAW_HASH=$(nix-prefetch-url --type sha256 "$ASSET_URL"); then
              RAW_HASH=$(printf '%s' "$RAW_HASH" | tail -n 1 | tr -d '[:space:]')
              if [ -n "$RAW_HASH" ]; then
                break
              fi
            fi
            echo "Retry $i failed, waiting 3s..."
            sleep 3
          done

          if [ -z "$RAW_HASH" ]; then
            echo "Gagal mengambil RAW_HASH dari $ASSET_URL" >&2
            exit 1
          fi

          SRI_HASH=$(nix hash convert --hash-algo sha256 --to sri "$RAW_HASH")
          export SRI_HASH
          echo "sri_hash=$SRI_HASH" >> "$GITHUB_OUTPUT"
          echo "New SRI Hash: $SRI_HASH"

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          ver = os.environ["VER"]
          tag = os.environ["TAG"]
          sri = os.environ["SRI_HASH"]

          flake_path = Path("flake.nix")
          content = flake_path.read_text(encoding="utf-8")

          content, n_ver = re.subn(
              r'(\bversion\s*=\s*")[^"]*(";)',
              lambda m: f"{m.group(1)}{ver}{m.group(2)}",
              content,
              count=1,
          )

          content, n_hash = re.subn(
              r'(\breleaseHash\s*=\s*")[^"]*(";)',
              lambda m: f"{m.group(1)}{sri}{m.group(2)}",
              content,
              count=1,
          )

          content = re.sub(
              r'(https://github\.com/ikhwan-satrio/penna/releases/download/)v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/',
              lambda m: f"{m.group(1)}{tag}/",
              content,
          )

          if n_hash == 0:
              raise RuntimeError("Tidak menemukan 'releaseHash = \"...\";' di flake.nix")

          flake_path.write_text(content, encoding="utf-8")
          print(f"Updated version ({n_ver}) and releaseHash ({n_hash}) in flake.nix")
          PY

      - name: Verify nix flake check
        run: |
          nix flake check --no-build-output

      - name: Commit and push updated flake.nix & CHANGELOG.md
        run: |
          git config user.name "ikhwan-satrio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.nix CHANGELOG.md
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada flake.nix atau CHANGELOG.md"
            exit 0
          fi

          git commit -m "chore(flake): update version and release hash for ${{ steps.ver.outputs.tag }}"

          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
