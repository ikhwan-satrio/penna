name: Build Tauri Multi-Artifact, Release & Update Flake

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (contoh: 1.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            TAG="v${RAW}"
            VER="${RAW}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Sync version in Tauri config
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ver = os.environ["VER"]

          tauri_conf = Path("src-tauri/tauri.conf.json")
          if tauri_conf.exists():
              data = json.loads(tauri_conf.read_text(encoding="utf-8"))
              if "version" in data:
                  data["version"] = ver
              elif "package" in data and isinstance(data["package"], dict):
                  data["package"]["version"] = ver
              tauri_conf.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          cargo_toml = Path("src-tauri/Cargo.toml")
          if cargo_toml.exists():
              text = cargo_toml.read_text(encoding="utf-8")
              text = re.sub(
                  r'(^\[package\][\s\S]*?^version\s*=\s*")[^"]*(")',
                  lambda m: f"{m.group(1)}{ver}{m.group(2)}",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              cargo_toml.write_text(text, encoding="utf-8")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Generate changelog from git commits
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.ver.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          {
            echo "## Changelog (${TAG})"
            echo ""
            if [[ -n "$PREV_TAG" ]]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" HEAD
            fi
            echo ""
          } > CHANGELOG_ENTRY.md

      - name: Build Tauri app & publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseBody: |
            See release assets below.
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: CHANGELOG_ENTRY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Compute Debian asset hash and update flake.nix
        id: hash
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          DEB_FILE=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name "*.deb" | head -n 1)
          if [[ -z "$DEB_FILE" ]]; then
            echo "No .deb artifact found in src-tauri/target/release/bundle/deb" >&2
            exit 1
          fi

          ASSET_NAME=$(basename "$DEB_FILE")
          SRI_HASH=$(nix hash file --type sha256 --sri "$DEB_FILE")

          echo "Built Debian asset: ${ASSET_NAME}"
          echo "New SRI Hash: ${SRI_HASH}"

          export ASSET_NAME SRI_HASH VER TAG REPO

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ver = os.environ["VER"]
          sri = os.environ["SRI_HASH"]
          tag = os.environ["TAG"]
          asset_name = os.environ["ASSET_NAME"]
          repo = os.environ["REPO"]

          flake_path = Path("flake.nix")
          content = flake_path.read_text(encoding="utf-8")

          content, n_ver = re.subn(
              r'(\bversion\s*=\s*")[^"]*(";)',
              lambda m: f"{m.group(1)}{ver}{m.group(2)}",
              content,
              count=1,
          )

          content, n_hash = re.subn(
              r'(\b(?:releaseHash|hash|sha256)\s*=\s*")[^"]*(";)',
              lambda m: f"{m.group(1)}{sri}{m.group(2)}",
              content,
              count=1,
          )

          if n_hash == 0:
              raise RuntimeError("Could not find releaseHash/hash/sha256 attribute in flake.nix")

          content = re.sub(
              rf'https://github\.com/{re.escape(repo)}/releases/download/[^"\s]+/[^"\s]+\.deb',
              f"https://github.com/{repo}/releases/download/{tag}/{asset_name}",
              content,
          )

          flake_path.write_text(content, encoding="utf-8")
          print(f"Updated flake.nix -> version={ver} ({n_ver}), hash={sri} ({n_hash}), asset={asset_name}")
          PY

      - name: Update flake.lock and verify flake
        run: |
          nix flake lock
          nix flake check --no-build

      - name: Commit and push updated flake to default branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          cp flake.nix /tmp/flake.nix
          cp flake.lock /tmp/flake.lock

          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          cp /tmp/flake.nix flake.nix
          cp /tmp/flake.lock flake.lock

          git add -f flake.nix flake.lock

          if git diff --staged --quiet; then
            echo "No changes to flake.nix or flake.lock"
            exit 0
          fi

          git commit -m "chore(flake): update version and release hash for ${{ steps.ver.outputs.tag }}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
