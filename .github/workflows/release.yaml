name: Build Tauri Multi-Artifact, Release & Update Flake

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (contoh: 1.0.0 atau v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            TAG="${RAW#v}"
            TAG="v${TAG}"
            VER="${TAG#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      # --- SETUP LINGKUNGAN BUILD ---
      - name: Setup Node.js (untuk Nuxt/Vue frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Ganti ke 'yarn' atau 'pnpm' jika kamu menggunakannya

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Diperlukan oleh Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            desktop-file-utils

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App (Multi-Bundle)
        run: |
          npm run tauri build -- --bundles deb,appimage,rpm,nsis

      - name: Generate changelog from git commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag }}^" 2>/dev/null || true)
          {
            echo "## Changelog (${{ steps.ver.outputs.tag }})"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..${{ steps.ver.outputs.tag }}"
            else
              git log --no-merges --pretty=format:"- %s (%h)" "${{ steps.ver.outputs.tag }}"
            fi
            echo ""
          } > CHANGELOG_ENTRY.md

          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG_ENTRY.md CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          else
            cp CHANGELOG_ENTRY.md CHANGELOG.md
          fi

      - name: Create GitHub Release & upload all Tauri artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: CHANGELOG_ENTRY.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- UPDATE FLAKE.NIX ---
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Fetch .deb hash & update flake.nix
        id: hash
        env:
          # Format nama file .deb bawaan Tauri: {productName}_{version}_{arch}.deb
          ASSET_NAME: penna_${{ steps.ver.outputs.version }}_amd64.deb
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          REPO: ikhwan-satrio/penna
        run: |
          ASSET_URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET_NAME}"
          echo "Fetching URL: $ASSET_URL"

          RAW_HASH=""
          for i in 1 2 3 4 5; do
            if RAW_HASH=$(nix-prefetch-url --type sha256 "$ASSET_URL"); then
              RAW_HASH=$(printf '%s' "$RAW_HASH" | tail -n 1 | tr -d '[:space:]')
              if [ -n "$RAW_HASH" ]; then
                break
              fi
            fi
            echo "Retry $i failed, waiting 3s..."
            sleep 3
          done

          if [ -z "$RAW_HASH" ]; then
            echo "Gagal mengambil RAW_HASH dari $ASSET_URL" >&2
            exit 1
          fi

          SRI_HASH=$(nix hash convert --hash-algo sha256 --to sri "$RAW_HASH")
          export SRI_HASH
          echo "sri_hash=$SRI_HASH" >> "$GITHUB_OUTPUT"
          echo "New SRI Hash: $SRI_HASH"

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          ver = os.environ["VER"]
          sri = os.environ["SRI_HASH"]

          flake_path = Path("flake.nix")
          content = flake_path.read_text(encoding="utf-8")

          # Update version
          content, n_ver = re.subn(
              r'(\bversion\s*=\s*")[^"]*(";)',
              lambda m: f"{m.group(1)}{ver}{m.group(2)}",
              content,
              count=1,
          )

          # Update releaseHash
          content, n_hash = re.subn(
              r'(\breleaseHash\s*=\s*")[^"]*(";)',
              lambda m: f"{m.group(1)}{sri}{m.group(2)}",
              content,
              count=1,
          )

          # Update URL untuk menunjuk ke format nama file .deb bawaan Tauri
          content = re.sub(
              r'(https://github\.com/ikhwan-satrio/penna/releases/download/)v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/[^/]+\.deb',
              lambda m: f"{m.group(1)}{os.environ['TAG']}/penna_{os.environ['VER']}_amd64.deb",
              content,
          )

          if n_hash == 0:
              raise RuntimeError("Tidak menemukan 'releaseHash = \"...\";' di flake.nix")

          flake_path.write_text(content, encoding="utf-8")
          print(f"Updated version ({n_ver}) and releaseHash ({n_hash}) in flake.nix")
          PY

      - name: Update flake.lock & verify flake
        run: |
          nix flake lock
          nix flake check --no-build

      - name: Commit and push updated flake.nix, flake.lock & CHANGELOG.md
        run: |
          git config user.name "ikhwan-satrio"
          git config user.email "ikhwansatria3974@gmail.com"

          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          git fetch origin "$DEFAULT_BRANCH"
          git add flake.nix flake.lock CHANGELOG.md
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada flake.nix, flake.lock, atau CHANGELOG.md"
            exit 0
          fi

          git commit -m "chore(flake): update version and release hash for ${{ steps.ver.outputs.tag }}"
          git rebase "origin/${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
